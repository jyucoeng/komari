version: "3.9"

services:
  komari:
    image: "${KOMARI_IMAGE:-ghcr.io/hynize/komari:latest}"
    container_name: komari
    restart: unless-stopped
    ports:
      - "25774:25774"
    environment:
      # GitHub 备份配置（备份和自动还原所需）
      GH_BACKUP_USER: "${GH_BACKUP_USER:-your_github_username}"
      GH_REPO: "${GH_REPO:-your_private_repo_name}"
      GH_PAT: "${GH_PAT:-your_github_personal_access_token}"
      GH_EMAIL: "${GH_EMAIL:-your_github_email@example.com}"

      # 面板登录凭证
      ADMIN_USERNAME: "${ADMIN_USERNAME:-yourusername}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-yourpassword}"

      # Cloudflare 隧道配置（必需，支持 Token 和 JSON 格式）
      ARGO_DOMAIN: "${ARGO_DOMAIN:-your-argo-domain.com}"
      KOMARI_CLOUDFLARED_TOKEN: "${KOMARI_CLOUDFLARED_TOKEN:-eyJxxxxx}"

      # 备份时间配置
      BACKUP_TIME: "${BACKUP_TIME:-0 20 * * *}"
      BACKUP_DAYS: "${BACKUP_DAYS:-10}"

      # 脚本更新配置
      NO_AUTO_RENEW: "${NO_AUTO_RENEW:-}"
      KOMARI_SOURCE_REPOSITORY: "${KOMARI_SOURCE_REPOSITORY:-}"
      KOMARI_SOURCE_BRANCH: "${KOMARI_SOURCE_BRANCH:-}"

      # Caddy 反代配置（可选，Caddy 用于反代 Komari 和提供订阅服务）
      CADDY_PROXY_PORT: "${CADDY_PROXY_PORT:-8001}"
      CADDY_VERSION: "${CADDY_VERSION:-2.9.1}"

      # 节点订阅配置（只有设置 UUID 时才启用订阅功能）
      UUID: "${UUID:-}"
      CF_IP: "${CF_IP:-}"
      SUB_NAME: "${SUB_NAME:-komari}"

    volumes:
      - ./komari-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:25774/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      options:
        max-size: "5m"
        max-file: "5"
