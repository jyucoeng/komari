name: 🧹 cleanup-ghcr-temp

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🧭 Get upstream version
        id: version
        run: |
          VERSION=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/komari-monitor/komari/releases/latest \
            | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="latest"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "上游版本: $VERSION"

      - name: 🏷️ Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 📦 Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ env.VERSION }}
          build-args: |
            KOMARI_VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🧹 清理旧版本镜像
        run: |
          PACKAGE_NAME=$(echo "${GITHUB_REPOSITORY,,}" | cut -d'/' -f2)
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          echo "开始清理包 ${PACKAGE_NAME} 的旧版本..."

          # 获取所有版本
          rm -f /tmp/all_versions.json /tmp/page.json
          echo "[]" > /tmp/all_versions.json
          PAGE=1
          while true; do
            curl -s -H "Authorization: token $TOKEN" \
              "https://api.github.com/user/packages/container/${PACKAGE_NAME}/versions?per_page=100&page=$PAGE" \
              > /tmp/page.json

            COUNT=$(python3 -c "import json; d=json.load(open('/tmp/page.json')); print(len(d) if isinstance(d, list) else 0)" 2>/dev/null)
            if [ -z "$COUNT" ] || [ "$COUNT" -eq 0 ]; then
              break
            fi

            python3 -c "
          import json
          existing = json.load(open('/tmp/all_versions.json'))
          new_data = json.load(open('/tmp/page.json'))
          if isinstance(new_data, list):
              existing.extend(new_data)
          json.dump(existing, open('/tmp/all_versions.json', 'w'))
          "

            PAGE=$((PAGE + 1))
            if [ "$PAGE" -gt 10 ]; then
              break
            fi
          done

          # 分类处理：找出每个标签最新版本，删除其余
          python3 <<'PYEOF'
          import json, subprocess, sys, os
          from collections import defaultdict

          token = os.environ['TOKEN'] if 'TOKEN' in os.environ else ''
          package_name = os.environ['PACKAGE_NAME'] if 'PACKAGE_NAME' in os.environ else ''

          data = json.load(open('/tmp/all_versions.json'))
          print(f"共获取 {len(data)} 条版本记录")

          # 按标签分组，每个标签只保留最新版本
          tag_latest = {}  # tag -> (version_id, created_at)
          untagged = []    # 所有无标签版本

          for v in data:
              if not isinstance(v, dict):
                  continue
              tags = v.get('metadata', {}).get('container', {}).get('tags', []) if v.get('metadata') else []
              vid = v.get('id')
              created = v.get('created_at', '')

              if not tags:
                  untagged.append((vid, created))
              else:
                  for tag in tags:
                      if tag not in tag_latest or created > tag_latest[tag][1]:
                          tag_latest[tag] = (vid, created)

          # 需要保留的版本 ID
          keep_ids = set()
          for vid, _ in tag_latest.values():
              keep_ids.add(vid)

          # 需要删除的：所有无标签版本 + 每个标签多余的版本
          to_delete = []
          for vid, _ in untagged:
              to_delete.append(vid)

          # 对于每个标签，删除不是最新的版本
          for v in data:
              if not isinstance(v, dict):
                  continue
              tags = v.get('metadata', {}).get('container', {}).get('tags', []) if v.get('metadata') else []
              vid = v.get('id')
              if vid in keep_ids:
                  continue
              if tags:  # 有标签但不是最新
                  to_delete.append(vid)

          print(f"保留 {len(keep_ids)} 个版本（每个标签最新）")
          print(f"Untagged 镜像: {len(untagged)} 个")
          print(f"需要删除: {len(to_delete)} 个")

          deleted = 0
          for vid in to_delete:
              subprocess.run(
                  ['curl', '-s', '-X', 'DELETE',
                   '-H', f'Authorization: token {token}',
                   f'https://api.github.com/user/packages/container/{package_name}/versions/{vid}'],
                  capture_output=True
              )
              deleted += 1
              if deleted % 10 == 0:
                  print(f"  已删除 {deleted} 个...")

          print(f"清理完成，共删除 {deleted} 个旧镜像")

          # 输出当前各版本镜像数量
          print("\n=== 当前各版本镜像数量 ===")
          from collections import Counter
          tag_counts = Counter()
          for v in data:
              if not isinstance(v, dict):
                  continue
              vid = v.get('id')
              if vid in to_delete:
                  continue
              tags = v.get('metadata', {}).get('container', {}).get('tags', []) if v.get('metadata') else []
              real_tags = [t for t in tags if t != 'latest']
              if real_tags:
                  for t in real_tags:
                      tag_counts[t] += 1
              elif not tags:
                  tag_counts['(untagged)'] += 1

          latest_version = None
          for v in data:
              if not isinstance(v, dict):
                  continue
              vid = v.get('id')
              if vid in to_delete:
                  continue
              tags = v.get('metadata', {}).get('container', {}).get('tags', []) if v.get('metadata') else []
              if 'latest' in tags:
                  real_tags = [t for t in tags if t != 'latest']
                  if real_tags:
                      latest_version = real_tags[0]
                  break

          for tag, count in sorted(tag_counts.items()):
              label = f"{tag}(latest)" if tag == latest_version else tag
              print(f"  {label}: {count} 个")
          print(f"  总计: {sum(tag_counts.values())} 个")
          PYEOF

          rm -f /tmp/all_versions.json /tmp/page.json
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
