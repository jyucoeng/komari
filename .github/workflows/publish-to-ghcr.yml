name: 🐳 publish-to-ghcr

on:
  push:
    branches: [ main ]
  schedule:
    # 每天北京时间上午 10 点 (UTC 2 点) 自动执行一次检查并构建
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      komari_version:
        description: "指定上游版本号 (留空则自动获取上游最新版)"
        required: false
        default: ""

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🧭 Set image metadata
        id: meta
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

          # 判断版本号逻辑：
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.komari_version }}" ]; then
            # 1. 如果是手动触发且输入了版本号，就用手填的
            VERSION="${{ github.event.inputs.komari_version }}"
          else
            # 2. 否则（代码推送 或 定时任务），自动调用 GitHub API 获取上游最新 Release
            VERSION=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/komari-monitor/komari/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
            # 容错：如果获取失败，回退到 latest
            if [ -z "$VERSION" ]; then
              VERSION="latest"
            fi
          fi

          echo "本次构建对应的上游版本为: $VERSION"
          echo "KOMARI_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: 🏷️ Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 📦 Build and Push Docker Image
        run: |
          IMAGE_NAME="${{ env.IMAGE_NAME }}"
          BUILD_VERSION="${{ env.KOMARI_VERSION }}"

          # 判断是否为最大版本，是则同时打 latest 标签
          LATEST_TAG=""
          if [ "$BUILD_VERSION" != "latest" ]; then
            MAX_VERSION=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/komari-monitor/komari/releases?per_page=30" \
              | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/' \
              | grep -iv "snapshot" \
              | python3 -c 'import re,sys; versions=[l.strip() for l in sys.stdin if l.strip()]; versions.sort(key=lambda v: (int(m.group(1)),int(m.group(2)),int(m.group(3)),v) if (m:=re.match(r"(\d+)\.(\d+)\.(\d+)",v)) else (0,0,0,v)); print(versions[-1] if versions else "")')

            echo "上游最大版本: $MAX_VERSION"
            echo "本次构建版本: $BUILD_VERSION"

            if [ "$BUILD_VERSION" = "$MAX_VERSION" ]; then
              echo "本次构建版本是最大版本，将同时设置 latest 标签"
              LATEST_TAG="-t ${IMAGE_NAME}:latest"
            else
              echo "本次构建版本不是最大版本，不设置 latest 标签"
            fi
          fi

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg KOMARI_VERSION=${BUILD_VERSION} \
            --annotation "org.opencontainers.image.title=Komari" \
            --annotation "org.opencontainers.image.description=基于 Komari 的增强封装，集成 Cloudflare Tunnel、Caddy 反代、VLESS/VMESS 订阅、GitHub 备份和脚本自动更新" \
            --annotation "org.opencontainers.image.source=https://github.com/jyucoeng/komari" \
            --annotation "org.opencontainers.image.readme=https://github.com/jyucoeng/komari/blob/main/README.md" \
            --annotation "org.opencontainers.image.licenses=MIT" \
            -t ${IMAGE_NAME}:${BUILD_VERSION} \
            ${LATEST_TAG} \
            --push \
            .

      - name: 🧹 清理旧版本镜像
        if: success() && env.KOMARI_VERSION != 'latest'
        run: |
          PACKAGE_NAME=$(echo "${GITHUB_REPOSITORY,,}" | cut -d'/' -f2)
          TOKEN="${{ secrets.GITHUB_TOKEN }}"

          echo "清理包 ${PACKAGE_NAME} 的旧版本..."

          rm -f /tmp/all_versions.json /tmp/page.json
          echo "[]" > /tmp/all_versions.json
          PAGE=1
          while true; do
            curl -s -H "Authorization: token $TOKEN" \
              "https://api.github.com/user/packages/container/${PACKAGE_NAME}/versions?per_page=100&page=$PAGE" \
              > /tmp/page.json

            COUNT=$(python3 -c "import json; d=json.load(open('/tmp/page.json')); print(len(d) if isinstance(d, list) else 0)" 2>/dev/null)
            if [ -z "$COUNT" ] || [ "$COUNT" -eq 0 ]; then
              break
            fi

            python3 << 'PYEOF'
import json
existing = json.load(open('/tmp/all_versions.json'))
new_data = json.load(open('/tmp/page.json'))
if isinstance(new_data, list):
    existing.extend(new_data)
json.dump(existing, open('/tmp/all_versions.json', 'w'))
PYEOF

            PAGE=$((PAGE + 1))
            if [ "$PAGE" -gt 10 ]; then
              break
            fi
          done

          python3 <<'PYEOF'
          import json, subprocess, os
          from collections import Counter

          token = os.environ['TOKEN']
          package_name = os.environ['PACKAGE_NAME']

          data = json.load(open('/tmp/all_versions.json'))
          print(f"共获取 {len(data)} 条版本记录")

          tag_latest = {}
          untagged = []

          for v in data:
              if not isinstance(v, dict):
                  continue
              tags = v.get('metadata', {}).get('container', {}).get('tags', []) if v.get('metadata') else []
              vid = v.get('id')
              created = v.get('created_at', '')

              if not tags:
                  untagged.append((vid, created))
              else:
                  for tag in tags:
                      if tag not in tag_latest or created > tag_latest[tag][1]:
                          tag_latest[tag] = (vid, created)

          keep_ids = set()
          for vid, _ in tag_latest.values():
              keep_ids.add(vid)

          to_delete = []
          for vid, _ in untagged:
              to_delete.append(vid)
          for v in data:
              if not isinstance(v, dict):
                  continue
              tags = v.get('metadata', {}).get('container', {}).get('tags', []) if v.get('metadata') else []
              vid = v.get('id')
              if vid in keep_ids:
                  continue
              if tags:
                  to_delete.append(vid)

          print(f"保留 {len(keep_ids)} 个版本（每个标签最新）")
          print(f"需要删除: {len(to_delete)} 个")

          deleted = 0
          for vid in to_delete:
              subprocess.run(
                  ['curl', '-s', '-X', 'DELETE',
                   '-H', f'Authorization: token {token}',
                   f'https://api.github.com/user/packages/container/{package_name}/versions/{vid}'],
                  capture_output=True
              )
              deleted += 1
              if deleted % 10 == 0:
                  print(f"  已删除 {deleted} 个...")

          print(f"清理完成，共删除 {deleted} 个旧镜像")

          print("\n=== 当前各版本镜像数量 ===")
          tag_counts = Counter()
          for v in data:
              if not isinstance(v, dict):
                  continue
              vid = v.get('id')
              if vid in to_delete:
                  continue
              tags = v.get('metadata', {}).get('container', {}).get('tags', []) if v.get('metadata') else []
              real_tags = [t for t in tags if t != 'latest']
              if real_tags:
                  for t in real_tags:
                      tag_counts[t] += 1
              elif not tags:
                  tag_counts['(untagged)'] += 1

          latest_version = None
          for v in data:
              if not isinstance(v, dict):
                  continue
              vid = v.get('id')
              if vid in to_delete:
                  continue
              tags = v.get('metadata', {}).get('container', {}).get('tags', []) if v.get('metadata') else []
              if 'latest' in tags:
                  real_tags = [t for t in tags if t != 'latest']
                  if real_tags:
                      latest_version = real_tags[0]
                  break

          for tag, count in sorted(tag_counts.items()):
              label = f"{tag}(latest)" if tag == latest_version else tag
              print(f"  {label}: {count} 个")
          print(f"  总计: {sum(tag_counts.values())} 个")
          PYEOF

          rm -f /tmp/all_versions.json /tmp/page.json
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
