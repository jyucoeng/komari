name: 🐳 publish-to-ghcr

on:
  push:
    branches: [ main ]
  schedule:
    # 每天北京时间上午 10 点 (UTC 2 点) 自动执行一次检查并构建
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      komari_version:
        description: "指定上游版本号 (留空则自动获取上游最新版)"
        required: false
        default: ""

env:
  KEEP_VERSIONS: 5  # 每个版本号保留的镜像数量

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🧭 Set image metadata
        id: meta
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

          # 判断版本号逻辑：
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.komari_version }}" ]; then
            # 1. 如果是手动触发且输入了版本号，就用手填的
            VERSION="${{ github.event.inputs.komari_version }}"
          else
            # 2. 否则（代码推送 或 定时任务），自动调用 GitHub API 获取上游最新 Release
            VERSION=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/komari-monitor/komari/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
            # 容错：如果获取失败，回退到 latest
            if [ -z "$VERSION" ]; then
              VERSION="latest"
            fi
          fi

          echo "本次构建对应的上游版本为: $VERSION"
          echo "KOMARI_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: 🏷️ Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 📦 Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.KOMARI_VERSION != 'latest' && format('{0}:{1}', env.IMAGE_NAME, env.KOMARI_VERSION) || '' }}
          build-args: |
            KOMARI_VERSION=${{ env.KOMARI_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🧹 清理旧版本镜像
        if: env.KOMARI_VERSION != 'latest'
        run: |
          PACKAGE_NAME=$(echo "${GITHUB_REPOSITORY,,}" | cut -d'/' -f2)
          VERSION="${{ env.KOMARI_VERSION }}"
          KEEP=${{ env.KEEP_VERSIONS }}
          TOKEN="${{ secrets.GITHUB_TOKEN }}"

          echo "清理版本 $VERSION 的旧镜像，保留最新 $KEEP 个..."

          rm -f /tmp/all_versions.json /tmp/page.json
          echo "[]" > /tmp/all_versions.json
          PAGE=1
          while true; do
            curl -s -H "Authorization: token $TOKEN" \
              "https://api.github.com/user/packages/container/${PACKAGE_NAME}/versions?per_page=100&page=$PAGE" \
              > /tmp/page.json

            COUNT=$(python3 -c "import json; d=json.load(open('/tmp/page.json')); print(len(d) if isinstance(d, list) else 0)" 2>/dev/null)
            if [ -z "$COUNT" ] || [ "$COUNT" -eq 0 ]; then
              break
            fi

            python3 -c "
          import json
          existing = json.load(open('/tmp/all_versions.json'))
          new_data = json.load(open('/tmp/page.json'))
          if isinstance(new_data, list):
              existing.extend(new_data)
          json.dump(existing, open('/tmp/all_versions.json', 'w'))
          "

            PAGE=$((PAGE + 1))
            if [ "$PAGE" -gt 10 ]; then
              break
            fi
          done

          python3 - "$VERSION" "$KEEP" "$TOKEN" "$PACKAGE_NAME" <<'PYEOF'
          import json, subprocess, sys

          version = sys.argv[1]
          keep = int(sys.argv[2])
          token = sys.argv[3]
          package_name = sys.argv[4]

          data = json.load(open('/tmp/all_versions.json'))
          print(f"共获取 {len(data)} 条版本记录")

          version_tagged = []
          untagged = []

          for v in data:
              if not isinstance(v, dict):
                  continue
              tags = v.get('metadata', {}).get('container', {}).get('tags', []) if v.get('metadata') else []
              vid = v.get('id')
              created = v.get('created_at', '')

              if not tags:
                  untagged.append((vid, created))
              elif version in tags:
                  version_tagged.append((vid, created))

          version_tagged.sort(key=lambda x: x[1], reverse=True)
          untagged.sort(key=lambda x: x[1], reverse=True)

          to_delete = []
          if len(version_tagged) > keep:
              to_delete.extend([vid for vid, _ in version_tagged[keep:]])
          to_delete.extend([vid for vid, _ in untagged])

          print(f"版本 {version} 标签镜像: {len(version_tagged)} 个 (保留 {min(keep, len(version_tagged))} 个)")
          print(f"Untagged 镜像: {len(untagged)} 个 (全部删除)")
          print(f"需要删除: {len(to_delete)} 个")

          deleted = 0
          for vid in to_delete:
              subprocess.run(
                  ['curl', '-s', '-X', 'DELETE',
                   '-H', f'Authorization: token {token}',
                   f'https://api.github.com/user/packages/container/{package_name}/versions/{vid}'],
                  capture_output=True
              )
              deleted += 1
              if deleted % 10 == 0:
                  print(f"  已删除 {deleted} 个...")

          print(f"清理完成，共删除 {deleted} 个旧镜像")
          PYEOF

          rm -f /tmp/all_versions.json /tmp/page.json
