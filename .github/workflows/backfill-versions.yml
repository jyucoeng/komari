name: 📦 backfill-versions

on:
  workflow_dispatch:
    inputs:
      # ─── 调参入口：并行构建组数 ───
      # 版本列表会按 round-robin 均匀分到 N 个 job 同时构建。
      # 建议值：4~12。越大越快，但 GHCR 可能限流。
      # 默认为 12，每组约 5 个版本，预计 10~15 分钟跑完。
      groups:
        description: '并行构建组数'
        required: false
        default: 12
        type: number

jobs:
  # ═══════════════════════════════════════════════
  # Job 1: discover — 获取上游 release 列表并分组
  # 只跑一次，不构建镜像，纯信息收集。
  # 输出: 版本列表、最大版本、分组数据
  # ═══════════════════════════════════════════════
  discover:
    runs-on: ubuntu-latest
    outputs:
      max_version: ${{ steps.gen.outputs.max_version }}
      all_versions_json: ${{ steps.gen.outputs.all_versions_json }}
      groups_json: ${{ steps.gen.outputs.groups_json }}
      group_indices: ${{ steps.gen.outputs.group_indices }}
    steps:
      - name: 🧭 获取上游所有 release 版本并分组
        id: gen
        run: |
          rm -f /tmp/releases.json /tmp/versions.txt /tmp/max_version.txt

          echo "[]" > /tmp/releases.json
          PAGE=1
          while true; do
            curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/komari-monitor/komari/releases?per_page=100&page=$PAGE" \
              > /tmp/page.json

            COUNT=$(python3 -c "import json; d=json.load(open('/tmp/page.json')); print(len(d) if isinstance(d, list) else 0)" 2>/dev/null)
            if [ -z "$COUNT" ] || [ "$COUNT" -eq 0 ]; then
              break
            fi

            python3 -c "
          import json
          existing = json.load(open('/tmp/releases.json'))
          new_data = json.load(open('/tmp/page.json'))
          if isinstance(new_data, list):
              existing.extend(new_data)
          json.dump(existing, open('/tmp/releases.json', 'w'))
          "

            PAGE=$((PAGE + 1))
            if [ "$PAGE" -gt 10 ]; then
              break
            fi
          done

          python3 <<-'PYEOF'
          import re, json

          def parse_version(v):
              match = re.match(r'(\d+)\.(\d+)\.(\d+)', v)
              return (int(match.group(1)), int(match.group(2)), int(match.group(3))) if match else (0, 0, 0)

          releases = json.load(open('/tmp/releases.json'))
          versions = []
          for r in releases:
              tag = r.get('tag_name', '')
              if 'snapshot' in tag.lower():
                  continue
              created = r.get('created_at', '')
              versions.append((parse_version(tag), created, tag))

          versions.sort(key=lambda x: (x[0], x[1]))
          sorted_tags = [v[2] for v in versions]

          max_version = sorted_tags[-1] if sorted_tags else ''
          open('/tmp/max_version.txt', 'w').write(max_version + '\n')
          open('/tmp/versions.txt', 'w').write('\n'.join(sorted_tags) + '\n')

          print(f'共发现 {len(sorted_tags)} 个版本')
          print(f'最大版本: {max_version}')
          PYEOF

          rm -f /tmp/releases.json /tmp/page.json

            # ─── round-robin 分组 + 预检可用架构 ───
            # 例: 15 个版本分 4 组 → 各组 [0,4,8,12], [1,5,9,13], [2,6,10,14], [3,7,11]
            # 空组会被过滤掉，不会创建无用的 build job
            # 同时用 ThreadPoolExecutor 并行检查各版本二进制可用性（386/riscv64/loong64），
            # build job 直接使用预检结果，无需再跑 wget。
            GROUPS=${{ inputs.groups || 12 }}

          python3 <<-PYEOF
          import json, os, subprocess
          from concurrent.futures import ThreadPoolExecutor, as_completed

          with open('/tmp/versions.txt') as f:
              versions = [line.strip() for line in f if line.strip()]

          n = int(os.environ.get('GROUPS', '12'))
          if n < 1:
              n = 1
          if n > len(versions):
              n = len(versions)

          # 并行检查各版本二进制可用性
          extra_arches = ['386', 'riscv64', 'loong64']

          def check_arches(v):
              result = {'v': v, 'platforms': 'linux/amd64,linux/arm64'}
              for arch in extra_arches:
                  r = subprocess.run(
                      ['wget', '-q', '--spider',
                       f'https://github.com/komari-monitor/komari/releases/download/{v}/komari-linux-{arch}'],
                      capture_output=True, timeout=15)
                  if r.returncode == 0:
                      result['platforms'] += f',linux/{arch}'
              return result

          enriched = [None] * len(versions)
          with ThreadPoolExecutor(max_workers=16) as pool:
              fut = {pool.submit(check_arches, v): i for i, v in enumerate(versions)}
              for f in as_completed(fut):
                  enriched[fut[f]] = f.result()

          groups = [[] for _ in range(n)]
          for i, item in enumerate(enriched):
              groups[i % n].append(item)
          groups = [g for g in groups if g]

          max_ver = versions[-1] if versions else ''

          with open(os.environ.get('GITHUB_OUTPUT'), 'a') as f:
              f.write(f'max_version={max_ver}\n')
              f.write(f'all_versions_json={json.dumps(versions)}\n')
              f.write(f'groups_json={json.dumps(groups)}\n')
              f.write(f'group_indices={json.dumps(list(range(len(groups))))}\n')

          total_built = sum(1 for item in enriched if 'linux/riscv64' in item['platforms'])
          print(f'分割为 {len(groups)} 组，每组 ~{max(1, len(versions)//len(groups))} 个版本')
          print(f'其中 {total_built} 个版本有 riscv64 二进制')
          PYEOF
        env:
          GROUPS: ${{ inputs.groups || 12 }}

  # ═══════════════════════════════════════════════
  # Job 2: build — 矩阵 job，每个 job 构建一组版本
  # 根据 discover 的 group_indices 动态展开。
  # 各组之间完全独立，无竞态。
  # ═══════════════════════════════════════════════
  build:
    needs: [discover]
    if: needs.discover.result == 'success'
    strategy:
      # ─── 矩阵展开 ───
      # group_indices = [0, 1, 2, ..., N-1]
      # 每个 index 对应 groups_json[index] 里的版本列表
      matrix:
        index: ${{ fromJSON(needs.discover.outputs.group_indices) }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 📦 构建组内版本镜像
        env:
          GROUPS_JSON: ${{ needs.discover.outputs.groups_json }}
          MATRIX_INDEX: ${{ matrix.index }}
          MAX_VERSION: ${{ needs.discover.outputs.max_version }}
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"

          TMPFILE=$(mktemp)
          python3 -c "
          import json, os
          groups = json.loads(os.environ['GROUPS_JSON'])
          idx = int(os.environ['MATRIX_INDEX'])
          for item in groups[idx]:
              print(json.dumps(item))
          " > "$TMPFILE"

          while IFS= read -r LINE; do
            [ -z "$LINE" ] && continue

            PAYLOAD=$(echo "$LINE" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(d.get('v', ''))
          print(d.get('platforms', ''))
          ")
            VERSION=$(echo "$PAYLOAD" | head -1)
            PLATFORMS=$(echo "$PAYLOAD" | tail -1)
            [ -z "$VERSION" ] && continue

            # 跳过已构建版本
            if docker buildx imagetools inspect ${IMAGE_NAME}:${VERSION} >/dev/null 2>&1; then
              echo "⏭️ 版本 $VERSION 已存在，跳过"
              continue
            fi

            if ! docker manifest inspect ghcr.io/komari-monitor/komari:${VERSION} >/dev/null 2>&1; then
              echo "跳过版本 $VERSION（上游无对应镜像）"
              continue
            fi

            echo "========== [组 $MATRIX_INDEX] 构建版本 $VERSION =========="
            echo "    平台: $PLATFORMS"

            # Multi-platform build & push
            # 如果是最大版本，同时打 latest 标签（避免后续 imagetools create 的 GHCR 复制问题）
            EXTRA_TAG=""
            if [ "$VERSION" = "$MAX_VERSION" ]; then
              EXTRA_TAG="-t ${IMAGE_NAME}:latest"
              echo "🏷️  最大版本，同时推送 latest 标签"
            fi
            docker buildx build \
              --platform ${PLATFORMS} \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              --build-arg KOMARI_VERSION=${VERSION} \
              --provenance=false --sbom=false \
              -t ${IMAGE_NAME}:${VERSION} \
              ${EXTRA_TAG} \
              --push \
              . || { echo "❌ 版本 $VERSION 构建失败"; continue; }

            # Verify manifest
            if docker buildx imagetools inspect ${IMAGE_NAME}:${VERSION} >/dev/null 2>&1; then
              echo "✅ Manifest verified"
            else
              echo "⚠️ Manifest not ready yet"
            fi

            echo "版本 $VERSION 构建完成"
            echo ""
          done < "$TMPFILE"
          rm -f "$TMPFILE"

  # ═══════════════════════════════════════════════
  # Job 3: finalize — 收尾工作
  # 等所有 build job 完成后执行：
  #   1. 把 latest 标签指向最大版本
  #   2. 生成 allVersion.md 报告
  #   3. 提交报告到仓库
  #   4. 清理 GHCR 上的旧版本镜像
  # ═══════════════════════════════════════════════
  finalize:
    needs: [discover, build]
    if: needs.discover.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 🏷️ 确保 latest 标签正确
        if: needs.discover.outputs.max_version != ''
        env:
          MAX_VERSION: ${{ needs.discover.outputs.max_version }}
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"

          # 如果 build job 已经正确推送了 latest，直接退出
          CURRENT=$(docker buildx imagetools inspect ${IMAGE_NAME}:latest --format '{{.Manifest.Digest}}' 2>/dev/null || echo "")
          TARGET=$(docker buildx imagetools inspect ${IMAGE_NAME}:${MAX_VERSION} --format '{{.Manifest.Digest}}' 2>/dev/null || echo "")

          if [ -n "$TARGET" ] && [ "$CURRENT" = "$TARGET" ]; then
            echo "✅ latest 已正确指向 $MAX_VERSION"
            exit 0
          fi

          echo "⚠️  latest 标签需要更新，通过 API 直接设置..."

          # 通过 GHCR Registry API 直接设置标签（比 imagetools create 更可靠）
          python3 <<-PYEOF
          import urllib.request, json, os, base64

          repo = os.environ.get('GITHUB_REPOSITORY', '').lower()
          token_secret = os.environ.get('GH_TOKEN', '')
          max_ver = os.environ.get('MAX_VERSION', '')

          if not repo or not max_ver:
              exit(1)

          # 获取 GHCR bearer token
          auth_str = base64.b64encode(f"x-access-token:{token_secret}".encode()).decode()
          req = urllib.request.Request(
              f"https://ghcr.io/token?scope=repository:{repo}:pull,push")
          req.add_header("Authorization", f"Basic {auth_str}")
          bearer = json.loads(urllib.request.urlopen(req).read())["token"]

          # 读取版本标签的 manifest
          manifest_url = f"https://ghcr.io/v2/{repo}/manifests/{max_ver}"
          req = urllib.request.Request(manifest_url)
          req.add_header("Authorization", f"Bearer {bearer}")
          req.add_header("Accept",
              "application/vnd.oci.image.index.v1+json,"
              "application/vnd.docker.distribution.manifest.list.v2+json,"
              "application/vnd.oci.image.manifest.v1+json,"
              "application/vnd.docker.distribution.manifest.v2+json")

          resp = urllib.request.urlopen(req)
          manifest_data = resp.read()
          content_type = resp.headers.get("Content-Type", "application/octet-stream")

          # 写入 latest 标签
          req = urllib.request.Request(
              f"https://ghcr.io/v2/{repo}/manifests/latest",
              data=manifest_data,
              method="PUT")
          req.add_header("Authorization", f"Bearer {bearer}")
          req.add_header("Content-Type", content_type)
          urllib.request.urlopen(req)
          print(f"✅ latest 标签已指向 {max_ver}")
          PYEOF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Generate allVersion.md report
        continue-on-error: true
        env:
          ALL_VERSIONS_JSON: ${{ needs.discover.outputs.all_versions_json }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          python3 <<'PYEOF'
          import subprocess, json, os
          from concurrent.futures import ThreadPoolExecutor, as_completed

          image_name = os.environ.get('IMAGE_NAME', '')
          all_versions_json = os.environ.get('ALL_VERSIONS_JSON', '[]')
          versions = json.loads(all_versions_json)
          versions.reverse()

          up_arches = ['amd64', 'arm64', 'arm', '386', 'riscv64', 'loong64']

          def check_version(v):
              row = {'version': v}

              r = subprocess.run(
                  ['docker', 'manifest', 'inspect', f'ghcr.io/komari-monitor/komari:{v}'],
                  capture_output=True, text=True, timeout=30)
              row['upstream_image'] = r.returncode == 0

              for arch in up_arches:
                  r = subprocess.run(
                      ['wget', '-q', '--spider',
                       f'https://github.com/komari-monitor/komari/releases/download/{v}/komari-linux-{arch}'],
                      capture_output=True, timeout=15)
                  row[f'bin_{arch}'] = r.returncode == 0

              r = subprocess.run(
                  ['docker', 'manifest', 'inspect', f'{image_name}:{v}'],
                  capture_output=True, text=True, timeout=30)
              if r.returncode == 0:
                  row['our_image'] = True
                  try:
                      manifest = json.loads(r.stdout)
                      platforms = []
                      if isinstance(manifest, dict) and 'manifests' in manifest:
                          for m in manifest.get('manifests', []):
                              plat = m.get('platform', {})
                              p = f"{plat.get('os', 'linux')}/{plat.get('architecture', '')}"
                              variant = plat.get('variant', '')
                              if variant:
                                  p += f"/{variant}"
                              platforms.append(p)
                      row['our_platforms'] = platforms
                  except (json.JSONDecodeError, KeyError):
                      row['our_platforms'] = []
              else:
                  row['our_image'] = False
                  row['our_platforms'] = []

              return row

          rows = [None] * len(versions)
          with ThreadPoolExecutor(max_workers=16) as pool:
              fut = {pool.submit(check_version, v): i for i, v in enumerate(versions)}
              for f in as_completed(fut):
                  rows[fut[f]] = f.result()

          lines = []
          lines.append("# Komari Multi-Arch Support Status")
          lines.append("")
          import datetime
          lines.append(f"Generated at: {datetime.datetime.now(datetime.UTC).strftime('%Y-%m-%d %H:%M:%S UTC')}")
          lines.append("")
          lines.append("## Column Description")
          lines.append("")
          lines.append("| Column | Meaning |")
          lines.append("|--------|---------|")
          lines.append("| `Version` | Upstream release version tag |")
          lines.append("| `Upstream Image` | Whether `ghcr.io/komari-monitor/komari:{version}` Docker image exists upstream |")
          lines.append("| `Upstream Binary Support` | Which architecture binaries are available in the upstream GitHub Release |")
          lines.append("| `Our Image` | Whether `ghcr.io/{{repo}}:{version}` has been built and pushed |")
          lines.append("| `Our Build Platforms` | Which platform images are included in our multi-arch manifest |")
          lines.append("")
          lines.append("## Status Table")
          lines.append("")
          lines.append("| Version | Upstream Image | Upstream Binary Support | Our Image | Our Build Platforms |")
          lines.append("|---------|:--------------:|-------------------------|:---------:|---------------------|")

          for row in rows:
              v = row['version']
              upstream_img = "✅" if row['upstream_image'] else "❌"
              bin_parts = [f"`{a}`" for a in up_arches if row[f'bin_{a}']]
              upstream_bins = ", ".join(bin_parts) if bin_parts else "—"
              our_img = "✅" if row['our_image'] else "❌"
              our_platforms = ", ".join(f"`{p}`" for p in row['our_platforms']) if row['our_platforms'] else "—"
              lines.append(f"| {v} | {upstream_img} | {upstream_bins} | {our_img} | {our_platforms} |")

          lines.append("")
          report = "\n".join(lines)
          with open('/tmp/allVersion.md', 'w') as f:
              f.write(report)
          print(f"Report generated: {len(rows)} versions")
          PYEOF

          cp /tmp/allVersion.md allVersion.md

      - name: 🚀 Commit allVersion.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add allVersion.md
          if git diff --staged --quiet; then
            echo "allVersion.md unchanged, nothing to commit"
          else
            git commit -m "Update allVersion.md"
            git pull --rebase
            git push
            echo "Committed and pushed allVersion.md"
          fi

      - name: 🧹 清理旧版本镜像
        run: |
          PACKAGE_NAME=$(echo "${GITHUB_REPOSITORY,,}" | cut -d'/' -f2)
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          echo "开始清理包 ${PACKAGE_NAME} 的旧版本..."

          rm -f /tmp/all_versions.json /tmp/page.json
          echo "[]" > /tmp/all_versions.json
          PAGE=1
          while true; do
            curl -s -H "Authorization: token $TOKEN" \
              "https://api.github.com/user/packages/container/${PACKAGE_NAME}/versions?per_page=100&page=$PAGE" \
              > /tmp/page.json

            COUNT=$(python3 -c "import json; d=json.load(open('/tmp/page.json')); print(len(d) if isinstance(d, list) else 0)" 2>/dev/null)
            if [ -z "$COUNT" ] || [ "$COUNT" -eq 0 ]; then
              break
            fi

            python3 -c "
          import json
          existing = json.load(open('/tmp/all_versions.json'))
          new_data = json.load(open('/tmp/page.json'))
          if isinstance(new_data, list):
              existing.extend(new_data)
          json.dump(existing, open('/tmp/all_versions.json', 'w'))
          "

            PAGE=$((PAGE + 1))
            if [ "$PAGE" -gt 10 ]; then
              break
            fi
          done

          python3 <<'PYEOF'
          import json, subprocess, os
          from collections import Counter

          token = os.environ['TOKEN']
          package_name = os.environ['PACKAGE_NAME']

          data = json.load(open('/tmp/all_versions.json'))
          print(f"共获取 {len(data)} 条版本记录")

          tag_latest = {}
          untagged = []

          for v in data:
              if not isinstance(v, dict):
                  continue
              tags = v.get('metadata', {}).get('container', {}).get('tags', []) if v.get('metadata') else []
              vid = v.get('id')
              created = v.get('created_at', '')

              if not tags:
                  untagged.append((vid, created))
              else:
                  for tag in tags:
                      if tag not in tag_latest or created > tag_latest[tag][1]:
                          tag_latest[tag] = (vid, created)

          keep_ids = set()
          for vid, _ in tag_latest.values():
              keep_ids.add(vid)

          to_delete = []
          for vid, _ in untagged:
              to_delete.append(vid)
          for v in data:
              if not isinstance(v, dict):
                  continue
              tags = v.get('metadata', {}).get('container', {}).get('tags', []) if v.get('metadata') else []
              vid = v.get('id')
              if vid in keep_ids:
                  continue
              if tags:
                  to_delete.append(vid)

          print(f"保留 {len(keep_ids)} 个版本（每个标签最新）")
          print(f"需要删除: {len(to_delete)} 个")

          deleted = 0
          for vid in to_delete:
              subprocess.run(
                  ['curl', '-s', '-X', 'DELETE',
                   '-H', f'Authorization: token {token}',
                   f'https://api.github.com/user/packages/container/{package_name}/versions/{vid}'],
                  capture_output=True
              )
              deleted += 1
              if deleted % 10 == 0:
                  print(f"  已删除 {deleted} 个...")

          print(f"清理完成，共删除 {deleted} 个旧镜像")

          print("\n=== 当前各版本镜像数量 ===")
          tag_counts = Counter()
          for v in data:
              if not isinstance(v, dict):
                  continue
              vid = v.get('id')
              if vid in to_delete:
                  continue
              tags = v.get('metadata', {}).get('container', {}).get('tags', []) if v.get('metadata') else []
              real_tags = [t for t in tags if t != 'latest']
              if real_tags:
                  for t in real_tags:
                      tag_counts[t] += 1
              elif not tags:
                  tag_counts['(untagged)'] += 1

          latest_version = None
          for v in data:
              if not isinstance(v, dict):
                  continue
              vid = v.get('id')
              if vid in to_delete:
                  continue
              tags = v.get('metadata', {}).get('container', {}).get('tags', []) if v.get('metadata') else []
              if 'latest' in tags:
                  real_tags = [t for t in tags if t != 'latest']
                  if real_tags:
                      latest_version = real_tags[0]
                  break

          for tag, count in sorted(tag_counts.items()):
              label = f"{tag}(latest)" if tag == latest_version else tag
              print(f"  {label}: {count} 个")
          print(f"  总计: {sum(tag_counts.values())} 个")
          PYEOF

          rm -f /tmp/all_versions.json /tmp/page.json
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
