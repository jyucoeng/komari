name: 📦 backfill-versions

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🏷️ Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 🧭 获取上游所有 release 版本
        run: |
          rm -f /tmp/releases.json /tmp/versions.txt /tmp/max_version.txt

          echo "[]" > /tmp/releases.json
          PAGE=1
          while true; do
            curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/komari-monitor/komari/releases?per_page=100&page=$PAGE" \
              > /tmp/page.json

            COUNT=$(python3 -c "import json; d=json.load(open('/tmp/page.json')); print(len(d) if isinstance(d, list) else 0)" 2>/dev/null)
            if [ -z "$COUNT" ] || [ "$COUNT" -eq 0 ]; then
              break
            fi

            python3 -c "
          import json
          existing = json.load(open('/tmp/releases.json'))
          new_data = json.load(open('/tmp/page.json'))
          if isinstance(new_data, list):
              existing.extend(new_data)
          json.dump(existing, open('/tmp/releases.json', 'w'))
          "

            PAGE=$((PAGE + 1))
            if [ "$PAGE" -gt 10 ]; then
              break
            fi
          done

          python3 <<-'PYEOF'
          import re, json

          def parse_version(v):
              match = re.match(r'(\d+)\.(\d+)\.(\d+)', v)
              return (int(match.group(1)), int(match.group(2)), int(match.group(3))) if match else (0, 0, 0)

          releases = json.load(open('/tmp/releases.json'))
          versions = []
          for r in releases:
              tag = r.get('tag_name', '')
              if 'snapshot' in tag.lower():
                  continue
              created = r.get('created_at', '')
              versions.append((parse_version(tag), created, tag))

          versions.sort(key=lambda x: (x[0], x[1]))
          sorted_tags = [v[2] for v in versions]

          max_version = sorted_tags[-1] if sorted_tags else ''
          open('/tmp/max_version.txt', 'w').write(max_version + '\n')
          open('/tmp/versions.txt', 'w').write('\n'.join(sorted_tags) + '\n')

          print(f'共发现 {len(sorted_tags)} 个版本')
          print(f'最大版本: {max_version}')
          print('构建顺序:')
          for i, v in enumerate(sorted_tags, 1):
              print(f'  {i}. {v}')
          PYEOF

          rm -f /tmp/releases.json /tmp/page.json

      - name: 📦 构建并推送所有版本镜像
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"

          while IFS= read -r VERSION; do
            [ -z "$VERSION" ] && continue

            if ! docker manifest inspect ghcr.io/komari-monitor/komari:${VERSION} >/dev/null 2>&1; then
              echo "跳过版本 $VERSION（上游无对应镜像）"
              continue
            fi

            echo "========== 构建版本 $VERSION =========="

            PLATFORMS="linux/amd64,linux/arm64"
            if wget -q --spider "https://github.com/komari-monitor/komari/releases/download/${VERSION}/komari-linux-386" 2>/dev/null; then
              PLATFORMS="${PLATFORMS},linux/386"
              echo "✅ 上游版本 ${VERSION} 支持 386 架构"
            else
              echo "⚠️ 上游版本 ${VERSION} 无 komari-linux-386 二进制，跳过 386 架构"
            fi
            if wget -q --spider "https://github.com/komari-monitor/komari/releases/download/${VERSION}/komari-linux-riscv64" 2>/dev/null; then
              if docker manifest inspect debian:trixie-slim 2>/dev/null | python3 -c "import json,sys; m=json.load(sys.stdin); exit(0 if any(p.get('architecture')=='riscv64' for p in (m.get('manifests',[]) if isinstance(m,dict) else [])) else 1)" 2>/dev/null; then
                PLATFORMS="${PLATFORMS},linux/riscv64"
                echo "✅ 上游版本 ${VERSION} 支持 riscv64 架构"
              else
                echo "⚠️ 上游版本 ${VERSION} 有 riscv64 二进制，但 debian:trixie-slim 不支持该架构，跳过"
              fi
            else
              echo "⚠️ 上游版本 ${VERSION} 无 komari-linux-riscv64 二进制，跳过 riscv64 架构"
            fi
            if wget -q --spider "https://github.com/komari-monitor/komari/releases/download/${VERSION}/komari-linux-loong64" 2>/dev/null; then
              if docker manifest inspect debian:trixie-slim 2>/dev/null | python3 -c "import json,sys; m=json.load(sys.stdin); exit(0 if any(p.get('architecture')=='loong64' for p in (m.get('manifests',[]) if isinstance(m,dict) else [])) else 1)" 2>/dev/null; then
                PLATFORMS="${PLATFORMS},linux/loong64"
                echo "✅ 上游版本 ${VERSION} 支持 loong64 架构"
              else
                echo "⚠️ 上游版本 ${VERSION} 有 loong64 二进制，但 debian:trixie-slim 不支持该架构，跳过"
              fi
            else
              echo "⚠️ 上游版本 ${VERSION} 无 komari-linux-loong64 二进制，跳过 loong64 架构"
            fi

            docker buildx build \
              --platform ${PLATFORMS} \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              --build-arg KOMARI_VERSION=$VERSION \
              -t ${IMAGE_NAME}:${VERSION} \
              --attest type=provenance,disabled=true \
              --attest type=sbom,disabled=true \
              --push \
              .

            echo "版本 $VERSION 构建完成"
            echo ""
          done < /tmp/versions.txt

      - name: 🏷️ 设置 latest 标签到最大版本
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          MAX_VERSION=$(cat /tmp/max_version.txt)

          echo "设置 latest 标签到版本 $MAX_VERSION"

          docker buildx imagetools create \
            -t ${IMAGE_NAME}:latest \
            ${IMAGE_NAME}:${MAX_VERSION}

          echo "latest 标签已指向 $MAX_VERSION"

      - name: 📊 Generate allVersion.md report
        continue-on-error: true
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"

          python3 <<'PYEOF'
          import subprocess, json, os

          image_name = os.environ.get('IMAGE_NAME', '')
          up_arches = ['amd64', 'arm64', 'arm', '386', 'riscv64', 'loong64']

          versions = []
          with open('/tmp/versions.txt') as f:
              for line in f:
                  line = line.strip()
                  if line:
                      versions.append(line)

          versions.reverse()

          rows = []
          for v in versions:
              row = {'version': v}
              r = subprocess.run(['docker', 'manifest', 'inspect', f'ghcr.io/komari-monitor/komari:{v}'], capture_output=True, text=True)
              row['upstream_image'] = r.returncode == 0

              for arch in up_arches:
                  r = subprocess.run(['wget', '-q', '--spider', f'https://github.com/komari-monitor/komari/releases/download/{v}/komari-linux-{arch}'], capture_output=True)
                  row[f'bin_{arch}'] = r.returncode == 0

              r = subprocess.run(['docker', 'manifest', 'inspect', f'{image_name}:{v}'], capture_output=True, text=True)
              if r.returncode == 0:
                  row['our_image'] = True
                  try:
                      manifest = json.loads(r.stdout)
                      platforms = []
                      if isinstance(manifest, dict) and 'manifests' in manifest:
                          for m in manifest.get('manifests', []):
                              plat = m.get('platform', {})
                              p = f"{plat.get('os', 'linux')}/{plat.get('architecture', '')}"
                              variant = plat.get('variant', '')
                              if variant:
                                  p += f"/{variant}"
                              platforms.append(p)
                      row['our_platforms'] = platforms
                  except (json.JSONDecodeError, KeyError):
                      row['our_platforms'] = []
              else:
                  row['our_image'] = False
                  row['our_platforms'] = []
              rows.append(row)

          lines = []
          lines.append("# Komari Multi-Arch Support Status")
          lines.append("")
          import datetime
          lines.append(f"Generated at: {datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M:%S UTC')}")
          lines.append("")
          lines.append("## Column Description")
          lines.append("")
          lines.append("| Column | Meaning |")
          lines.append("|--------|---------|")
          lines.append("| `Version` | Upstream release version tag |")
          lines.append("| `Upstream Image` | Whether `ghcr.io/komari-monitor/komari:{version}` Docker image exists upstream |")
          lines.append("| `Upstream Binary Support` | Which architecture binaries are available in the upstream GitHub Release |")
          lines.append("| `Our Image` | Whether `ghcr.io/{{repo}}:{version}` has been built and pushed |")
          lines.append("| `Our Build Platforms` | Which platform images are included in our multi-arch manifest |")
          lines.append("")
          lines.append("## Status Table")
          lines.append("")
          lines.append("| Version | Upstream Image | Upstream Binary Support | Our Image | Our Build Platforms |")
          lines.append("|---------|:--------------:|-------------------------|:---------:|---------------------|")

          for row in rows:
              v = row['version']
              upstream_img = "✅" if row['upstream_image'] else "❌"
              bin_parts = [f"`{a}`" for a in up_arches if row[f'bin_{a}']]
              upstream_bins = ", ".join(bin_parts) if bin_parts else "—"
              our_img = "✅" if row['our_image'] else "❌"
              our_platforms = ", ".join(f"`{p}`" for p in row['our_platforms']) if row['our_platforms'] else "—"
              lines.append(f"| {v} | {upstream_img} | {upstream_bins} | {our_img} | {our_platforms} |")

          lines.append("")
          report = "\n".join(lines)
          with open('/tmp/allVersion.md', 'w') as f:
              f.write(report)
          print(f"Report generated: {len(rows)} versions")
          PYEOF

          cp /tmp/allVersion.md allVersion.md

      - name: 🚀 Commit allVersion.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add allVersion.md
          if git diff --staged --quiet; then
            echo "allVersion.md unchanged, nothing to commit"
          else
            git commit -m "Update allVersion.md"
            git push
            echo "Committed and pushed allVersion.md"
          fi

      - name: 🧹 清理旧版本镜像
        run: |
          PACKAGE_NAME=$(echo "${GITHUB_REPOSITORY,,}" | cut -d'/' -f2)
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          echo "开始清理包 ${PACKAGE_NAME} 的旧版本..."

          rm -f /tmp/all_versions.json /tmp/page.json
          echo "[]" > /tmp/all_versions.json
          PAGE=1
          while true; do
            curl -s -H "Authorization: token $TOKEN" \
              "https://api.github.com/user/packages/container/${PACKAGE_NAME}/versions?per_page=100&page=$PAGE" \
              > /tmp/page.json

            COUNT=$(python3 -c "import json; d=json.load(open('/tmp/page.json')); print(len(d) if isinstance(d, list) else 0)" 2>/dev/null)
            if [ -z "$COUNT" ] || [ "$COUNT" -eq 0 ]; then
              break
            fi

            python3 -c "
          import json
          existing = json.load(open('/tmp/all_versions.json'))
          new_data = json.load(open('/tmp/page.json'))
          if isinstance(new_data, list):
              existing.extend(new_data)
          json.dump(existing, open('/tmp/all_versions.json', 'w'))
          "

            PAGE=$((PAGE + 1))
            if [ "$PAGE" -gt 10 ]; then
              break
            fi
          done

          python3 <<'PYEOF'
          import json, subprocess, os
          from collections import Counter

          token = os.environ['TOKEN']
          package_name = os.environ['PACKAGE_NAME']

          data = json.load(open('/tmp/all_versions.json'))
          print(f"共获取 {len(data)} 条版本记录")

          tag_latest = {}
          untagged = []

          for v in data:
              if not isinstance(v, dict):
                  continue
              tags = v.get('metadata', {}).get('container', {}).get('tags', []) if v.get('metadata') else []
              vid = v.get('id')
              created = v.get('created_at', '')

              if not tags:
                  untagged.append((vid, created))
              else:
                  for tag in tags:
                      if tag not in tag_latest or created > tag_latest[tag][1]:
                          tag_latest[tag] = (vid, created)

          keep_ids = set()
          for vid, _ in tag_latest.values():
              keep_ids.add(vid)

          to_delete = []
          for vid, _ in untagged:
              to_delete.append(vid)
          for v in data:
              if not isinstance(v, dict):
                  continue
              tags = v.get('metadata', {}).get('container', {}).get('tags', []) if v.get('metadata') else []
              vid = v.get('id')
              if vid in keep_ids:
                  continue
              if tags:
                  to_delete.append(vid)

          print(f"保留 {len(keep_ids)} 个版本（每个标签最新）")
          print(f"需要删除: {len(to_delete)} 个")

          deleted = 0
          for vid in to_delete:
              subprocess.run(
                  ['curl', '-s', '-X', 'DELETE',
                   '-H', f'Authorization: token {token}',
                   f'https://api.github.com/user/packages/container/{package_name}/versions/{vid}'],
                  capture_output=True
              )
              deleted += 1
              if deleted % 10 == 0:
                  print(f"  已删除 {deleted} 个...")

          print(f"清理完成，共删除 {deleted} 个旧镜像")

          print("\n=== 当前各版本镜像数量 ===")
          tag_counts = Counter()
          for v in data:
              if not isinstance(v, dict):
                  continue
              vid = v.get('id')
              if vid in to_delete:
                  continue
              tags = v.get('metadata', {}).get('container', {}).get('tags', []) if v.get('metadata') else []
              real_tags = [t for t in tags if t != 'latest']
              if real_tags:
                  for t in real_tags:
                      tag_counts[t] += 1
              elif not tags:
                  tag_counts['(untagged)'] += 1

          latest_version = None
          for v in data:
              if not isinstance(v, dict):
                  continue
              vid = v.get('id')
              if vid in to_delete:
                  continue
              tags = v.get('metadata', {}).get('container', {}).get('tags', []) if v.get('metadata') else []
              if 'latest' in tags:
                  real_tags = [t for t in tags if t != 'latest']
                  if real_tags:
                      latest_version = real_tags[0]
                  break

          for tag, count in sorted(tag_counts.items()):
              label = f"{tag}(latest)" if tag == latest_version else tag
              print(f"  {label}: {count} 个")
          print(f"  总计: {sum(tag_counts.values())} 个")
          PYEOF

          rm -f /tmp/all_versions.json /tmp/page.json /tmp/versions.txt /tmp/max_version.txt
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
