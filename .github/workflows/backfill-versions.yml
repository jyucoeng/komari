name: 📦 backfill-versions

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 🧹 删除所有现有版本
        run: |
          PACKAGE_NAME=$(echo "${GITHUB_REPOSITORY,,}" | cut -d'/' -f2)
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          echo "开始删除包 ${PACKAGE_NAME} 的所有版本..."

          rm -f /tmp/all_versions.json /tmp/page.json
          echo "[]" > /tmp/all_versions.json
          PAGE=1
          while true; do
            curl -s -H "Authorization: token $TOKEN" \
              "https://api.github.com/user/packages/container/${PACKAGE_NAME}/versions?per_page=100&page=$PAGE" \
              > /tmp/page.json

            COUNT=$(python3 -c "import json; d=json.load(open('/tmp/page.json')); print(len(d) if isinstance(d, list) else 0)" 2>/dev/null)
            if [ -z "$COUNT" ] || [ "$COUNT" -eq 0 ]; then
              break
            fi

            python3 -c "
          import json
          existing = json.load(open('/tmp/all_versions.json'))
          new_data = json.load(open('/tmp/page.json'))
          if isinstance(new_data, list):
              existing.extend(new_data)
          json.dump(existing, open('/tmp/all_versions.json', 'w'))
          "

            PAGE=$((PAGE + 1))
            if [ "$PAGE" -gt 10 ]; then
              break
            fi
          done

          python3 <<'PYEOF'
          import json, subprocess, os

          token = os.environ['TOKEN']
          package_name = os.environ['PACKAGE_NAME']

          data = json.load(open('/tmp/all_versions.json'))
          print(f"共获取 {len(data)} 条版本记录，开始删除...")

          deleted = 0
          for v in data:
              if not isinstance(v, dict):
                  continue
              vid = v.get('id')
              if vid:
                  subprocess.run(
                      ['curl', '-s', '-X', 'DELETE',
                       '-H', f'Authorization: token {token}',
                       f'https://api.github.com/user/packages/container/{package_name}/versions/{vid}'],
                      capture_output=True
                  )
                  deleted += 1
                  if deleted % 10 == 0:
                      print(f"  已删除 {deleted} 个...")

          print(f"删除完成，共删除 {deleted} 个版本")
          PYEOF

          rm -f /tmp/all_versions.json /tmp/page.json
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ github.event.repository.name }}

      - name: 🧭 获取上游所有 release 版本
        run: |
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/komari-monitor/komari/releases?per_page=30" \
            | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/' \
            | grep -iv "snapshot" > /tmp/raw_versions.txt

          python3 -c "
          import re

          def parse_version(v):
              match = re.match(r'(\d+)\.(\d+)\.(\d+)', v)
              if match:
                  return (int(match.group(1)), int(match.group(2)), int(match.group(3)), v)
              return (0, 0, 0, v)

          versions = open('/tmp/raw_versions.txt').read().strip().split('\n')
          versions.sort(key=parse_version)

          # 最大版本
          max_version = versions[-1]
          open('/tmp/max_version.txt', 'w').write(max_version + '\n')
          open('/tmp/versions.txt', 'w').write('\n'.join(versions) + '\n')

          print(f'最大版本: {max_version}')
          print('构建顺序:')
          for i, v in enumerate(versions, 1):
              print(f'  {i}. {v}')
          "

      - name: 🏷️ Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 📦 构建并推送所有版本镜像
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"

          while IFS= read -r VERSION; do
            [ -z "$VERSION" ] && continue

            if ! docker manifest inspect ghcr.io/komari-monitor/komari:${VERSION} >/dev/null 2>&1; then
              echo "跳过版本 $VERSION（上游无对应镜像）"
              continue
            fi

            echo "========== 构建版本 $VERSION =========="

            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --build-arg KOMARI_VERSION=$VERSION \
              -t ${IMAGE_NAME}:${VERSION} \
              --push \
              .

            echo "版本 $VERSION 构建完成"
            echo ""
          done < /tmp/versions.txt

      - name: 🏷️ 设置 latest 标签到最大版本
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          MAX_VERSION=$(cat /tmp/max_version.txt)

          echo "设置 latest 标签到版本 $MAX_VERSION"

          docker buildx imagetools create \
            -t ${IMAGE_NAME}:latest \
            ${IMAGE_NAME}:${MAX_VERSION}

          echo "latest 标签已指向 $MAX_VERSION"

      - name: 🧹 清理旧版本镜像
        run: |
          PACKAGE_NAME=$(echo "${GITHUB_REPOSITORY,,}" | cut -d'/' -f2)
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          echo "开始清理包 ${PACKAGE_NAME} 的旧版本..."

          rm -f /tmp/all_versions.json /tmp/page.json
          echo "[]" > /tmp/all_versions.json
          PAGE=1
          while true; do
            curl -s -H "Authorization: token $TOKEN" \
              "https://api.github.com/user/packages/container/${PACKAGE_NAME}/versions?per_page=100&page=$PAGE" \
              > /tmp/page.json

            COUNT=$(python3 -c "import json; d=json.load(open('/tmp/page.json')); print(len(d) if isinstance(d, list) else 0)" 2>/dev/null)
            if [ -z "$COUNT" ] || [ "$COUNT" -eq 0 ]; then
              break
            fi

            python3 -c "
          import json
          existing = json.load(open('/tmp/all_versions.json'))
          new_data = json.load(open('/tmp/page.json'))
          if isinstance(new_data, list):
              existing.extend(new_data)
          json.dump(existing, open('/tmp/all_versions.json', 'w'))
          "

            PAGE=$((PAGE + 1))
            if [ "$PAGE" -gt 10 ]; then
              break
            fi
          done

          python3 <<'PYEOF'
          import json, subprocess, os
          from collections import Counter

          token = os.environ['TOKEN']
          package_name = os.environ['PACKAGE_NAME']

          data = json.load(open('/tmp/all_versions.json'))
          print(f"共获取 {len(data)} 条版本记录")

          tag_latest = {}
          untagged = []

          for v in data:
              if not isinstance(v, dict):
                  continue
              tags = v.get('metadata', {}).get('container', {}).get('tags', []) if v.get('metadata') else []
              vid = v.get('id')
              created = v.get('created_at', '')

              if not tags:
                  untagged.append((vid, created))
              else:
                  for tag in tags:
                      if tag not in tag_latest or created > tag_latest[tag][1]:
                          tag_latest[tag] = (vid, created)

          keep_ids = set()
          for vid, _ in tag_latest.values():
              keep_ids.add(vid)

          to_delete = []
          for vid, _ in untagged:
              to_delete.append(vid)
          for v in data:
              if not isinstance(v, dict):
                  continue
              tags = v.get('metadata', {}).get('container', {}).get('tags', []) if v.get('metadata') else []
              vid = v.get('id')
              if vid in keep_ids:
                  continue
              if tags:
                  to_delete.append(vid)

          print(f"保留 {len(keep_ids)} 个版本（每个标签最新）")
          print(f"需要删除: {len(to_delete)} 个")

          deleted = 0
          for vid in to_delete:
              subprocess.run(
                  ['curl', '-s', '-X', 'DELETE',
                   '-H', f'Authorization: token {token}',
                   f'https://api.github.com/user/packages/container/{package_name}/versions/{vid}'],
                  capture_output=True
              )
              deleted += 1
              if deleted % 10 == 0:
                  print(f"  已删除 {deleted} 个...")

          print(f"清理完成，共删除 {deleted} 个旧镜像")

          print("\n=== 当前各版本镜像数量 ===")
          tag_counts = Counter()
          for v in data:
              if not isinstance(v, dict):
                  continue
              vid = v.get('id')
              if vid in to_delete:
                  continue
              tags = v.get('metadata', {}).get('container', {}).get('tags', []) if v.get('metadata') else []
              real_tags = [t for t in tags if t != 'latest']
              if real_tags:
                  for t in real_tags:
                      tag_counts[t] += 1
              elif not tags:
                  tag_counts['(untagged)'] += 1

          latest_version = None
          for v in data:
              if not isinstance(v, dict):
                  continue
              vid = v.get('id')
              if vid in to_delete:
                  continue
              tags = v.get('metadata', {}).get('container', {}).get('tags', []) if v.get('metadata') else []
              if 'latest' in tags:
                  real_tags = [t for t in tags if t != 'latest']
                  if real_tags:
                      latest_version = real_tags[0]
                  break

          for tag, count in sorted(tag_counts.items()):
              label = f"{tag}(latest)" if tag == latest_version else tag
              print(f"  {label}: {count} 个")
          print(f"  总计: {sum(tag_counts.values())} 个")
          PYEOF

          rm -f /tmp/all_versions.json /tmp/page.json /tmp/versions.txt /tmp/raw_versions.txt /tmp/max_version.txt
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
